services:
  duckbricks:
    build: .
    ports:
      - "8082:8000"
    volumes:
      - duckbricks-data:/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duckbricks
      POSTGRES_PASSWORD: duckbricks
      POSTGRES_DB: duckbricks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckbricks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  marimo:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir marimo &&
             marimo edit --no-token --host 0.0.0.0 --port 2718"
    working_dir: /data/workspace
    volumes:
      - duckbricks-data:/data
    ports:
      - "2718:2718"
    restart: unless-stopped

volumes:
  duckbricks-data:
  postgres-data:
