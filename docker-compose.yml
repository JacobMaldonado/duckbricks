x-duckbricks-runtime-environment: &duckbricks-runtime-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://duckbricks:duckbricks@postgres:5432/duckbricks}
  DUCKLAKE_PG_HOST: ${DUCKLAKE_PG_HOST:-postgres}
  DUCKLAKE_PG_PORT: ${DUCKLAKE_PG_PORT:-5432}
  DUCKLAKE_PG_DATABASE: ${DUCKLAKE_PG_DATABASE:-duckbricks}
  DUCKLAKE_PG_USER: ${DUCKLAKE_PG_USER:-duckbricks}
  DUCKLAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:-duckbricks}
  DUCKBRICKS_WORKSPACE_PATH: ${DUCKBRICKS_WORKSPACE_PATH:-/data/workspace}
  DUCKBRICKS_STORAGE_BACKEND: ${DUCKBRICKS_STORAGE_BACKEND:-local}
  MARIMO_URL: ${MARIMO_URL:-/marimo}
  MARIMO_INTERNAL_URL: ${MARIMO_INTERNAL_URL:-http://marimo:2718}
  PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
  PREFECT_INTERNAL_URL: ${PREFECT_INTERNAL_URL:-http://prefect-server:4200}
  PREFECT_EXTERNAL_URL: ${PREFECT_EXTERNAL_URL:-http://localhost:4200}

services:
  duckbricks:
    build: .
    ports:
      - "8082:8000"
    volumes:
      - duckbricks-data:/data
    env_file:
      - .env
    environment:
      <<: *duckbricks-runtime-environment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      marimo:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duckbricks
      POSTGRES_PASSWORD: duckbricks
      POSTGRES_DB: duckbricks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckbricks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://duckbricks:duckbricks@postgres/prefect"
      PREFECT_UI_API_URL: "${PREFECT_EXTERNAL_URL:-http://localhost:4200}/api"
      PREFECT_UI_SERVE_BASE: "/prefect-ui"
    volumes:
      - prefect-data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  duckbricks-worker:
    build: .
    command: prefect worker start --pool duckbricks-pool
    environment:
      <<: *duckbricks-runtime-environment
    env_file:
      - .env
    volumes:
      - duckbricks-data:/data
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  marimo:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir marimo duckdb uv sqlglot duckbricks-utils &&
             python /app/start_marimo.py edit --sandbox --no-token --host 0.0.0.0 --port 2718 --base-url /marimo"
    working_dir: /data/workspace
    volumes:
      - duckbricks-data:/data
      - ./app/helpers/start_marimo.py:/app/start_marimo.py:ro
    env_file:
      - .env
    environment:
      DUCKBRICKS_STORAGE_BACKEND: ${DUCKBRICKS_STORAGE_BACKEND:-local}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2718/marimo/')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  duckbricks-data:
  postgres-data:
  prefect-data:
