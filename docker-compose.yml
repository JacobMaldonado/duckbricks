services:
  ungit:
    image: cerebralvoyage/ungit-docker:1.5.30-25
    ports:
      - "8448:8448"
    volumes:
      - duckbricks-data:/var/local/ungit
    environment:
      HOME: /home/node
    command:
      - "--ungitBindIp=0.0.0.0"
      - "--forcedLaunchPath=/var/local/ungit"
      - "--no-launchBrowser"
      - "--no-bugTracking"
      - "--no-autoFetch"
      - "--logLevel=warn"
    healthcheck:
      test: "/usr/bin/wget --no-verbose --quiet --tries=1 --spider http://127.0.0.1:8448 || exit 1"
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  duckbricks:
    build: .
    ports:
      - "8082:8000"
    volumes:
      - duckbricks-data:/data
    env_file:
      - .env
    environment:
      MARIMO_URL: /marimo
      MARIMO_INTERNAL_URL: http://marimo:2718
      PREFECT_API_URL: http://prefect-server:4200/api
      DUCKBRICKS_WORKSPACE_PATH: /data/workspace
      UNGIT_URL: /ungit
      UNGIT_INTERNAL_URL: http://ungit:8448
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duckbricks
      POSTGRES_PASSWORD: duckbricks
      POSTGRES_DB: duckbricks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckbricks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://duckbricks:duckbricks@postgres/prefect"
      PREFECT_UI_API_URL: "${PREFECT_EXTERNAL_URL:-http://localhost:4200}/api"
      PREFECT_UI_SERVE_BASE: "/prefect-ui"
    volumes:
      - prefect-data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  duckbricks-worker:
    build: .
    command: prefect worker start --pool duckbricks-pool
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MARIMO_URL: /marimo
      MARIMO_INTERNAL_URL: http://marimo:2718
      DUCKBRICKS_WORKSPACE_PATH: /data/workspace
    env_file:
      - .env
    volumes:
      - duckbricks-data:/data
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  marimo:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir marimo duckdb uv sqlglot &&
             until [ -f /data/.duckbricks/start_marimo.py ]; do echo 'Waiting for DuckBricks helpers...'; sleep 2; done &&
             python /data/.duckbricks/start_marimo.py edit --sandbox --no-token --host 0.0.0.0 --port 2718 --base-url /marimo --autosave after_delay"
    working_dir: /data/workspace
    volumes:
      - duckbricks-data:/data
    env_file:
      - .env
    environment:
      PYTHONPATH: /data/.duckbricks
    restart: unless-stopped

volumes:
  duckbricks-data:
  postgres-data:
  prefect-data:
