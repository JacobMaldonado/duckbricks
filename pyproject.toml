[tool.poetry]
name = "duckbricks"
version = "0.1.3"
description = "Open-source data platform built on DuckLake"
authors = ["DuckBricks Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
nicegui = ">=2.0"
duckdb = ">=1.3.0"
pydantic = ">=2.0"
python-dotenv = ">=1.0"
sqlalchemy = {version = "^2.0.49", python = ">=3.12,<3.15"}
psycopg2-binary = {version = "^2.9.11", python = ">=3.12,<3.15"}
alembic = {version = "^1.18.4", python = ">=3.12,<3.15"}
prefect = {version = ">=3.6.27,<4.0", python = ">=3.12,<3.15"}
marimo = {version = ">=0.10.0", python = ">=3.12,<3.15"}

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
httpx = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.services.metastore.ducklake_manager",
    "app.ui.components.catalog_browser",
    "app.ui.components.layout",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
